# =====================================================================
# Valores sensíveis e os que mudam por ambiente vêm de variáveis de ambiente:
#   - na sua máquina: arquivo .env na raiz do projeto (fora do Git)
#   - no Railway: aba Variables do serviço
#   - no GitHub Actions: o próprio workflow (.github/workflows/ci.yml)
# =====================================================================
server:
  port: ${PORT:8080}
  forward-headers-strategy: native

spring:
  application:
    name: v0
  config:
    # o .env é opcional: no Railway ele não existe e as variáveis vêm do painel
    import: "optional:file:.env[.properties]"
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      data-locations: classpath:permissions.sql, classpath:auditTrail.sql

jwt:
  secret: ${JWT_SECRET}
  expiration-ms: 3600000

# ===== Termos de Uso e Política de Privacidade =====
# Ao publicar uma nova versão: atualize o arquivo em resources/legal/ E o número aqui.
# Todos os usuários precisarão aceitar de novo no próximo login.
legal:
  terms-version: "2.0"
  privacy-version: "2.0"
  token-ttl-ms: 900000                # validade do termsToken (15 min)

# ===== MFA por e-mail =====
mfa:
  enabled: ${MFA_ENABLED:true}
  code-ttl-minutes: 10
  max-attempts: 5
  resend-cooldown-seconds: 60
  max-codes-per-hour: 5
  token-ttl-ms: 900000
  mock-code: ${MFA_MOCK_CODE:}
  # depois de confirmar o código, o navegador fica "lembrado" por este tempo e o próximo login não pede o MFA
  # (a senha continua sendo pedida). 0 = pedir o código em todo login.
  trust-ttl-ms: ${MFA_TRUST_TTL_MS:1800000}   # 30 min

# ===== RESET DE SENHA =====

password-reset:
  code-ttl-minutes: 15
  max-attempts: 5
  cooldown-seconds: 60
  max-codes-per-hour: 5

# ============== TROCA DE SENHA ===============
password-change:
  token-ttl-ms: 900000

# ===== BLOQUEIO DE LOGIN (RNF05) =====
login-lock:
  max-attempts: 5
  lock-minutes: 5
  window-minutes: 15

# ===== DESATIVAÇÃO DE ALUNOS POR INATIVIDADE (RF17) =====
students:
  inactivity-days: 90
  inactivity-cron: "0 0 3 * * *"

# ===================OPÇÃO DE VENDAS ´============================
sales:
  enabled: ${SALES_ENABLED:false}

resend:
  api-key: ${RESEND_API_KEY:}
  base-url: https://api.resend.com
  from: "${MAIL_FROM:Searchoteca <no-reply@searchoteca.com.br>}"

logging:
  level:
    root: INFO
    searchoteca: ${LOG_LEVEL_APP:DEBUG}   # no Railway: INFO (DEBUG mostra detalhe demais em produção)
    AUDIT: INFO
    org.springframework.security: WARN
  pattern:
    level: "%5p [req=%X{requestId:-}] [user=%X{user:-}]"
  file:
    # Railway: deixe LOG_FILE sem definir -> só console (o painel guarda os logs; o disco é apagado a cada deploy)
    # sua máquina: LOG_FILE=logs/searchoteca.log no .env
    name: ${LOG_FILE:}
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 30
      total-size-cap: 500MB
  structured:
    format:
      file: ecs

# ===== Busca de dados do livro pelo ISBN (cadastro de livro) =====
# 1º ISBNdb (com chave); se ela não achar ou cair, Open Library (gratuita).
# Sem ISBNDB_API_KEY, a ISBNdb fica desligada e só a Open Library é usada.
isbn-lookup:
  connect-timeout-ms: 3000
  read-timeout-ms: 5000
  isbndb:
    api-key: ${ISBNDB_API_KEY:}
    # o endereço depende do plano: o painel da ISBNdb mostra o "API host" da sua chave
    base-url: ${ISBNDB_BASE_URL:https://api2.isbndb.com}
  open-library:
    base-url: https://openlibrary.org

# ===== Monitoramento (health check do Railway) =====
# Só o /actuator/health fica exposto, e sem detalhes: responde {"status":"UP"} ou DOWN (inclui o banco).
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
